name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-templates:
    name: Validate Templates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Validate CJS Template
      - name: Validate CJS Template
        run: |
          cd cjs
          npm ci
          npm run lint
          npm run format:check
          npm test

      # Validate ESM JavaScript Template
      - name: Validate ESM-JS Template
        run: |
          cd esm-js
          npm ci
          npm run lint
          npm run format:check
          npm test

      # Validate ESM TypeScript Template
      - name: Validate ESM-TS Template
        run: |
          cd esm-ts
          npm ci
          npm run lint
          npm run format:check
          npm run build
          npm test
